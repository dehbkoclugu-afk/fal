name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: fal-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fal-backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fal_test
          REDIS_URL: redis://localhost:6379/0

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fal-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fal-mobile/package-lock.json
      - run: npm ci
      - run: npm run ci:check
      - run: npm run security:check
      - run: ./node_modules/.bin/expo-doctor
        env:
          EXPO_OFFLINE: "1"
      - run: npm run build:web
        env:
          EXPO_OFFLINE: "1"
