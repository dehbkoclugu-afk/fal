# Meditasyon reposundaki çalışan APK yolu: Expo prebuild + yerel Gradle.
# EAS/Expo token gerektirmez. Çıktı GitHub Actions'ta "telve-apk" artifact'i olur.
name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eas-preview.yml"

permissions:
  contents: read

concurrency:
  group: android-preview-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://api-staging.telve.app
    defaults:
      run:
        working-directory: fal-mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fal-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Disk temizliği
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Android projesini üret
        run: npx expo prebuild --platform android --no-install

      - name: Mimarileri daralt
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties

      - name: Gradle belleğini ayarla
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          echo 'org.gradle.workers.max=2' >> android/gradle.properties
          grep -E '^(org.gradle.jvmargs|org.gradle.workers.max)=' android/gradle.properties

      - name: Preview APK derle
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: telve-apk
          path: fal-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Özet
        run: |
          {
            echo "## Telve Android Preview"
            echo
            echo "✅ APK derlendi ve **telve-apk** artifact'i olarak yüklendi."
            echo
            echo "[Actions çalışmasını aç](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
